name: Build and Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: win64_msvc2019_64
          modules: 'qtmultimedia'

      - name: Configure
        run: cmake -S Podcast -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path stage
          Copy-Item build/Release/PodcastClient.exe stage/
          Copy-Item build/Release/PodcastServer.exe stage/
          windeployqt stage/PodcastClient.exe
          windeployqt stage/PodcastServer.exe
          Compress-Archive -Path stage/* -DestinationPath Podcast-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: win-build
          path: Podcast-win-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake \
            qt6-base-dev qtmultimedia6-dev libqt6multimedia6-plugins \
            libgl1-mesa-dev libxkbcommon-dev libegl1-mesa-dev

      - name: Configure
        run: cmake -S Podcast -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package Linux
        run: |
          L=/usr/lib/x86_64-linux-gnu
          mkdir -p stage/lib stage/plugins
          cp build/PodcastClient build/PodcastServer stage/

          # Qt-библиотеки (из системы - версии совпадают с ICU)
          cp -P $L/libQt6Core.so*       stage/lib/ || true
          cp -P $L/libQt6Gui.so*        stage/lib/ || true
          cp -P $L/libQt6Widgets.so*    stage/lib/ || true
          cp -P $L/libQt6Network.so*    stage/lib/ || true
          cp -P $L/libQt6Multimedia.so* stage/lib/ || true
          cp -P $L/libQt6DBus.so*       stage/lib/ || true
          cp -P $L/libQt6XcbQpa.so*     stage/lib/ || true
          cp -P $L/libQt6OpenGL.so*     stage/lib/ || true

          # Системные зависимости Qt (та же версия, что и Qt)
          cp -P $L/libicui18n.so*   stage/lib/ || true
          cp -P $L/libicuuc.so*     stage/lib/ || true
          cp -P $L/libicudata.so*   stage/lib/ || true
          cp -P $L/libdouble-conversion.so* stage/lib/ || true
          cp -P $L/libpcre2-16.so*  stage/lib/ || true
          cp -P $L/libstdc++.so.6*  stage/lib/ || true
          cp -P $L/libgcc_s.so.1    stage/lib/ || true

          # Плагины Qt (включая звук: pulse/alsa)
          cp -rP $L/qt6/plugins/platforms    stage/plugins/ || true
          cp -rP $L/qt6/plugins/imageformats stage/plugins/ || true
          cp -rP $L/qt6/plugins/iconengines  stage/plugins/ || true
          cp -rP $L/qt6/plugins/styles       stage/plugins/ || true
          cp -rP $L/qt6/plugins/multimedia   stage/plugins/ || true

          # Скрипты запуска
          printf '#!/bin/bash\nDIR="$(cd "$(dirname "$0")" && pwd)"\nexport LD_LIBRARY_PATH="$DIR/lib:$LD_LIBRARY_PATH"\nexport QT_PLUGIN_PATH="$DIR/plugins"\nexec "$DIR/PodcastClient" "$@"\n' > stage/run_client.sh
          printf '#!/bin/bash\nDIR="$(cd "$(dirname "$0")" && pwd)"\nexport LD_LIBRARY_PATH="$DIR/lib:$LD_LIBRARY_PATH"\nexec "$DIR/PodcastServer" "$@"\n' > stage/run_server.sh
          chmod +x stage/run_client.sh stage/run_server.sh

          echo "=== Содержимое lib ==="
          ls stage/lib | head -40

          tar -czf Podcast-linux-x64.tar.gz -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: Podcast-linux-x64.tar.gz

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare files
        run: |
          mkdir out
          cp artifacts/win-build/Podcast-win-x64.zip out/
          cp artifacts/linux-build/Podcast-linux-x64.tar.gz out/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Release #${{ github.run_number }}"
          files: |
            out/Podcast-win-x64.zip
            out/Podcast-linux-x64.tar.gz
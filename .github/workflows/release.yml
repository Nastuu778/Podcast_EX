name: Build and Release

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          modules: 'qtmultimedia'

      - name: Configure
        run: cmake -S Podcast -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path stage
          Copy-Item build/PodcastClient.exe stage/
          Copy-Item build/PodcastServer.exe stage/
          windeployqt stage/PodcastClient.exe
          windeployqt stage/PodcastServer.exe
          Compress-Archive -Path stage/* -DestinationPath Podcast-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: win-build
          path: Podcast-win-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libegl1-mesa-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          modules: 'qtmultimedia'

      - name: Configure
        run: cmake -S Podcast -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package Linux
        run: |
          mkdir stage
          cp build/PodcastClient build/PodcastServer stage/
          tar -czf Podcast-linux-x64.tar.gz -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: Podcast-linux-x64.tar.gz

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare files
        run: |
          mkdir out
          cp artifacts/win-build/Podcast-win-x64.zip out/
          cp artifacts/linux-build/Podcast-linux-x64.tar.gz out/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Release #${{ github.run_number }}"
          files: |
            out/Podcast-win-x64.zip
            out/Podcast-linux-x64.tar.gz